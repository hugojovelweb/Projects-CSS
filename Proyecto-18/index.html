<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com"  crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">  
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <title>Proyecto 18 CSS - Hugo Jovel</title>
</head>
<body>

    <div class="layout">
        <article class="layout__card">
            <div class="card__container-img">
                <img src="./assets/img/coche.jpg" alt="Foto de Coche" class="card__img">
            </div>

            <div class="card__content">
                <h2 class="card__title">
                    Foto del nuevo coche muy comodo.
                </h2>
                <p class="card__description">
                    Este es un coche muy comodo, con un diseño moderno y elegante. 
                    Ideal para viajes largos y para disfrutar de la carretera. 
                    Su interior espacioso y sus asientos confortables lo hacen perfecto para cualquier aventura.
                </p>

                <div class="card__user">
                    <div class="user__info">

                        <div class="user__container-img">
                            <img class="user__img" src="./assets/img/default-user3.jpg" alt="Foto de Usuario">
                        </div>

                        <div class="user__container-name">
                            <span class="user__name">Hugo Jovel Web</span>
                            <span class="user__date">22-07-2025</span>
                        </div>                         
                    </div>   
                     <div class="user__icon">
                            <i class="fa-regular fa-comment"></i>
                        </div>                                   

                </div>
            </div>
        </article>
    </div>
    
</body>
</html>
