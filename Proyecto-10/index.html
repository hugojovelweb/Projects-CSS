<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com"  crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/fonts/fontawesome-free-6.6.0-web/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/styles.css">

    <title>Proyecto 10 css Hugo Jovel</title>
    
</head>
<body>
    <div class="layout">
        <h1 class="layout__tittle">
            Busca tu hotel
        </h1>

        <form class="layout__search">
            <input type="search" class="search__input" placeholder="Busca tu hotel y lo encontraremos"/>

            <button class="search__btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>

        <main class="layout__results">
            <article class="results__result">
                <p class="result__subtitle">Nombre:</p>
                <h3 class="result__title">Hotel Cesar Marcelo</h3>
            </article>

            <article class="results__result">
                <p class="result__subtitle">Ubicación:</p>
                <h3 class="result__title">Playas Marcell</h3>
            </article>

            <article class="results__result">
                <p class="result__subtitle">Fecha:</p>
                <h3 class="result__title">28-04-2025</h3>
            </article>
            </main>

        <section class="layout__map">
            <iframe class="map__frame"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3878.991563067183!2d-89.80559682423846!3d13.5361089022495!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f62b799e0017815%3A0x27533e84f67ffb92!2sLas%20Veraneras%20Villas%20%26%20Resort!5e0!3m2!1sen!2ssv!4v1745862528018!5m2!1sen!2ssv" 
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>"

        </section>
        
    </div>
</body>
</html>
